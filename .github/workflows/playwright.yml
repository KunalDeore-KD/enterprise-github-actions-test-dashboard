# Generic Playwright dashboard workflow.
# Configure suites and browsers in dashboard.config.json at the repo root.

name: Playwright Tests

on:
  push:
    branches: [main, master, test]
  pull_request:
    branches: [main, master, test]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (optional)'
        required: false
        default: ''
        type: string
      testSuite:
        description: 'Test suite to run (any value from dashboard.config.json suites)'
        required: false
        default: 'all'
        type: string
      selectedTests:
        description: 'Specific test file paths, comma-separated (overrides testSuite)'
        required: false
        default: ''
        type: string
      browsers:
        description: 'Comma-separated browser projects (chromium, firefox, webkit). Empty means all configured browsers.'
        required: false
        default: ''
        type: string

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Detect Playwright layout
        id: layout
        run: |
          set -euo pipefail
          if [ -f dashboard.config.json ]; then
            PLAYWRIGHT_BASE=$(node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const config = JSON.parse(fs.readFileSync('dashboard.config.json', 'utf8'));
          const testDir = config.playwright?.testDir || 'playwright/tests';
          const parent = path.dirname(testDir);
          if (parent !== '.' && fs.existsSync(path.join(parent, 'package.json'))) {
            process.stdout.write(parent);
          } else if (fs.existsSync('playwright/package.json')) {
            process.stdout.write('playwright');
          } else {
            process.stdout.write('.');
          }
          NODE
            )
          elif [ -f playwright/package.json ]; then
            PLAYWRIGHT_BASE="playwright"
          else
            PLAYWRIGHT_BASE="."
          fi
          echo "playwright_base=$PLAYWRIGHT_BASE" >> "$GITHUB_OUTPUT"
          echo "Detected Playwright base directory: $PLAYWRIGHT_BASE"

      - name: Install dependencies
        run: |
          set -euo pipefail
          BASE="${{ steps.layout.outputs.playwright_base }}"
          if [ -f dashboard.config.json ]; then
            echo "Dashboard integration detected — using npm install (CI deps installed separately)"
            npm install
            echo "Installing dashboard CI script dependencies..."
            npm install --no-save tsx@4.19.2 typescript@5.6.2 glob@11.0.0 @types/node@20.14.0
          else
            npm ci
          fi
          if [ "$BASE" != "." ] && [ -f "$BASE/package-lock.json" ]; then
            npm ci --prefix "$BASE"
            npm run build:shared-lib --prefix "$BASE" --if-present
          fi

      - name: Install Playwright browsers
        run: npx tsx scripts/run-suite.ts --install-browsers

      - name: Ensure Playwright JSON reporter
        run: npx tsx scripts/ensure-reporter-config.ts

      - name: Validate Playwright reporter config
        run: npx tsx scripts/validate-reporter-config.ts

      - name: Run Playwright tests
        id: run_tests
        run: |
          set -o pipefail
          BASE="${{ steps.layout.outputs.playwright_base }}"
          rm -rf "${BASE}/test-results" "${BASE}/playwright-report"
          mkdir -p "${GITHUB_WORKSPACE}/.tmp"
          LOG="${GITHUB_WORKSPACE}/.tmp/playwright_run.log"
          npx tsx scripts/run-suite.ts --suite "${{ inputs.testSuite }}" --selected "${{ inputs.selectedTests }}" --browsers "${{ inputs.browsers }}" --log "$LOG"
          rc=$?
          echo "exit_code=$rc" >> $GITHUB_OUTPUT
          echo "log_path=$LOG" >> $GITHUB_OUTPUT
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment || '' }}
          TEST_SUITE_FILTER: ${{ inputs.testSuite || 'all' }}
        continue-on-error: true

      - name: Run test discovery
        if: always()
        run: npx tsx scripts/test-discovery.ts

      - name: Extract commit and workflow metadata
        if: always()
        run: npx tsx scripts/extract-metadata.ts

      - name: Generate dashboard data
        if: always()
        run: npx tsx scripts/generate-dashboard-data.ts
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          TEST_ENVIRONMENT: ${{ inputs.environment || '' }}
          TEST_SUITE_FILTER: ${{ inputs.selectedTests != '' && 'single' || (inputs.testSuite || 'all') }}
          TEST_SELECTED_TESTS: ${{ inputs.selectedTests || '' }}
          WORKFLOW_RUN_LOG_PATH: ${{ steps.run_tests.outputs.log_path }}
          ARTIFACT_RETENTION_DAYS: '30'
          ARTIFACT_URL: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALLURE_REPORT_URL: ''

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts-${{ github.run_number }}
          path: |
            .tmp/playwright_run.log
            **/playwright-report/**
            **/test-results/**
            test-catalog.json
            dashboard/test-catalog.json
          retention-days: 30

      - name: Update dashboard history
        if: always()
        run: npx tsx scripts/manage-history.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate test results
        if: always()
        run: |
          LOG_PATH="${{ steps.run_tests.outputs.log_path }}"
          EXIT_CODE="${{ steps.run_tests.outputs.exit_code }}"
          echo "Playwright exit code: $EXIT_CODE"
          if [ -n "$LOG_PATH" ] && [ -f "$LOG_PATH" ]; then
            echo "---- Playwright run log (truncated) ----"
            sed -n '1,500p' "$LOG_PATH" || true
            if grep -q "No tests found" "$LOG_PATH"; then
              echo "No tests found; treating as success."
              exit 0
            fi
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Playwright failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Playwright tests passed."
